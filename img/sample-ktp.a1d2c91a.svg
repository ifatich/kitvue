<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <!-- Background Gradient resembling Indonesian e-KTP cyan/blue tint -->
    <linearGradient id="ktpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e2eb" />
      <stop offset="50%" stop-color="#a4d4e0" />
      <stop offset="100%" stop-color="#93c7d6" />
    </linearGradient>
    <!-- Chip Gradient -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <!-- Security Pattern Lines -->
    <pattern id="securityWaves" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 0 20 10 T 40 10" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.3" />
      <path d="M 0 18 Q 10 8 20 18 T 40 18" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Card Base with Rounded Corners (ISO ID-1) -->
  <rect x="2" y="2" width="852" height="536" rx="28" fill="url(#ktpBg)" stroke="#5ba4b8" stroke-width="3" />
  <rect x="2" y="2" width="852" height="536" rx="28" fill="url(#securityWaves)" />

  <!-- Header Section -->
  <text x="428" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#0f3044" text-anchor="middle" letter-spacing="2">REPUBLIK INDONESIA</text>
  <text x="428" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#1b4d6b" text-anchor="middle" letter-spacing="1.5">PROVINSI DKI JAKARTA</text>
  <text x="428" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1b4d6b" text-anchor="middle" letter-spacing="1">JAKARTA PUSAT</text>

  <!-- NIK Header & Number -->
  <text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0f3044">NIK</text>
  <text x="180" y="130" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="bold" fill="#0f3044" letter-spacing="2">3171011208900001</text>

  <!-- Data Fields (Left Column: Labels) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#244b61">
    <text x="40" y="162">Nama</text>
    <text x="40" y="188">Tempat/Tgl Lahir</text>
    <text x="40" y="214">Jenis Kelamin</text>
    <text x="40" y="240">Alamat</text>
    <text x="70" y="264">RT/RW</text>
    <text x="70" y="288">Kel/Desa</text>
    <text x="70" y="312">Kecamatan</text>
    <text x="40" y="338">Agama</text>
    <text x="40" y="364">Status Perkawinan</text>
    <text x="40" y="390">Pekerjaan</text>
    <text x="40" y="416">Kewarganegaraan</text>
    <text x="40" y="442">Berlaku Hingga</text>
  </g>

  <!-- Colons (Separator) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0f3044">
    <text x="175" y="162">:</text>
    <text x="175" y="188">:</text>
    <text x="175" y="214">:</text>
    <text x="175" y="240">:</text>
    <text x="175" y="264">:</text>
    <text x="175" y="288">:</text>
    <text x="175" y="312">:</text>
    <text x="175" y="338">:</text>
    <text x="175" y="364">:</text>
    <text x="175" y="390">:</text>
    <text x="175" y="416">:</text>
    <text x="175" y="442">:</text>
  </g>

  <!-- Field Values (Right Column) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0f2636">
    <text x="195" y="162">BUDI DARMAWAN</text>
    <text x="195" y="188">JAKARTA, 12-08-1990</text>
    <text x="195" y="214">LAKI-LAKI</text>
    <text x="360" y="214" font-weight="600" fill="#244b61">Gol. Darah : <tspan font-weight="bold" fill="#0f2636">O</tspan></text>
    <text x="195" y="240">JL. KRAMAT RAYA NO. 162</text>
    <text x="195" y="264">004/002</text>
    <text x="195" y="288">KENARI</text>
    <text x="195" y="312">SENEN</text>
    <text x="195" y="338">ISLAM</text>
    <text x="195" y="364">KAWIN</text>
    <text x="195" y="390">KARYAWAN SWASTA</text>
    <text x="195" y="416">WNI</text>
    <text x="195" y="442">SEUMUR HIDUP</text>
  </g>

  <!-- Photo Box (Standard Red Background for Even Birth Year in Indonesia) -->
  <g transform="translate(615, 120)">
    <!-- Photo frame shadow & border -->
    <rect x="-3" y="-3" width="196" height="256" rx="8" fill="#ffffff" stroke="#c0d7de" stroke-width="2" />
    <!-- Red background -->
    <rect x="0" y="0" width="190" height="250" rx="6" fill="#c92a2a" />
    
    <!-- Male Avatar Silhouette -->
    <!-- Head -->
    <circle cx="95" cy="80" r="45" fill="#f8f9fa" />
    <!-- Hair -->
    <path d="M 52 75 C 52 45 68 35 95 35 C 122 35 138 45 138 75 C 130 60 115 55 95 55 C 75 55 60 60 52 75 Z" fill="#212529" />
    <!-- Neck -->
    <rect x="80" y="120" width="30" height="25" fill="#f8f9fa" />
    <!-- Torso / Suit -->
    <path d="M 20 250 L 35 160 C 45 145 65 140 80 142 L 95 185 L 110 142 C 125 140 145 145 155 160 L 170 250 Z" fill="#1e293b" />
    <!-- White shirt collar & tie -->
    <polygon points="95,142 80,142 95,190" fill="#ffffff" />
    <polygon points="95,142 110,142 95,190" fill="#ffffff" />
    <polygon points="95,160 90,175 95,240 100,175" fill="#0284c7" />
  </g>

  <!-- Smart Card Chip Graphic -->
  <g transform="translate(525, 230)">
    <rect width="60" height="48" rx="6" fill="url(#chipGold)" stroke="#d97706" stroke-width="1.5" />
    <line x1="0" y1="24" x2="60" y2="24" stroke="#b45309" stroke-width="1" />
    <line x1="20" y1="0" x2="20" y2="48" stroke="#b45309" stroke-width="1" />
    <line x1="40" y1="0" x2="40" y2="48" stroke="#b45309" stroke-width="1" />
    <circle cx="30" cy="24" r="8" fill="none" stroke="#b45309" stroke-width="1" />
  </g>

  <!-- Signature Area -->
  <g transform="translate(615, 395)">
    <text x="95" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1b4d6b" text-anchor="middle">JAKARTA PUSAT</text>
    <text x="95" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1b4d6b" text-anchor="middle">12-08-2021</text>
    <!-- Stylized Signature Path -->
    <path d="M 30 65 Q 50 40 70 55 T 100 45 T 130 60 T 160 50" fill="none" stroke="#0f3044" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 40 75 L 150 72" fill="none" stroke="#0f3044" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Watermark Hologram Stamp -->
  <circle cx="560" cy="420" r="32" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,2" opacity="0.6" />
  <text x="560" y="424" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0284c7" text-anchor="middle" opacity="0.6">E-KTP ASLI</text>
</svg>
